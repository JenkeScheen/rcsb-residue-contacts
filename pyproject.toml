[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rcsb-residue-contacts"
version = "0.2.0"
description = "Find PDB ligands that pi-stack (face-to-face / edge-to-face) on aromatic residues, using only the RCSB PDB APIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jenke Scheen" }]
keywords = ["rcsb", "pdb", "pi-stacking", "pharmacophore", "cheminformatics", "structural-biology", "protein-ligand"]
dependencies = [
    "rdkit>=2023.09",
    "gemmi>=0.6",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
    "tqdm>=4.6",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rcsb-residue-contacts = "rcsb_residue_contacts.cli:main"

[project.urls]
Homepage = "https://github.com/JenkeScheen/rcsb-residue-contacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["network: hits the live RCSB APIs (run with RCSB_NETWORK_TESTS=1)"]
